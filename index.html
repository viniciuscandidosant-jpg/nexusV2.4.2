/* ══════════════════════════════════════
   ADMINISTRAÇÃO LOCAL
══════════════════════════════════════ */
function AdminLocal({ toast }) {
  const [trash, setTrash] = useState(() => LS.get('trash') || []);
  const [logs, setLogs] = useState(() => LS.get('audit') || []);
  const [logBusca, setLogBusca] = useState('');
  const pedidos = LS.get('pedidos') || [];
  const orcamentos = LS.get('orcamentos') || [];
  const rncs = LS.get('rncs') || [];
  const logsFiltrados = logs.filter(l => { const ac = l.acao || l.action || ''; const det = l.det || l.detail || ''; return !logBusca || `${ac} ${det} ${fDate(l.data)}`.toLowerCase().includes(logBusca.toLowerCase()); });
  const restaurar = t => {
    if (!t) return;
    if (t.type === 'pedido') { const a=LS.get('pedidos')||[]; LS.set('pedidos',[t.record,...a]); }
    if (t.type === 'orcamento') { const a=LS.get('orcamentos')||[]; LS.set('orcamentos',[t.record,...a]); }
    if (t.type === 'recebimento') { const a=LS.get('pedidos')||[]; LS.set('pedidos', a.map(p => p.id === t.record?.pedidoId ? { ...p, status:'pendente', recebimento:null } : p)); }
    if (t.type === 'rnc') { const a=LS.get('rncs')||[]; LS.set('rncs',[t.record,...a]); }
    const nt=trash.filter(x=>x.id!==t.id); LS.set('trash',nt); setTrash(nt); auditLog('Restauração de lixeira', `${t.type}: ${t.record?.numero || t.record?.semana || t.record?.id || ''}`); setLogs(LS.get('audit')||[]); toast.show('Registro restaurado');
  };
  const removerDef = t => {
    if (!strongConfirm('Exclusão permanente')) return;
    const nt=trash.filter(x=>x.id!==t.id); LS.set('trash',nt); setTrash(nt); auditLog('Exclusão permanente', `${t.type}: ${t.record?.numero || t.record?.semana || t.record?.id || ''}`); setLogs(LS.get('audit')||[]); toast.show('Excluído permanentemente');
  };
  return html`<div class="page" style=${{ maxWidth:'1440px' }}>
    <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:16, marginBottom:16 }}>
      <div><h2 style=${{ fontSize:22, fontWeight:800, fontFamily:"'Plus Jakarta Sans',sans-serif", margin:0 }}>Administração</h2><p style=${{ fontSize:13, color:'var(--s2)', margin:'4px 0 0' }}>Governança local, lixeira, auditoria e controle de semana.</p></div>
      <span class="badge bor">Lixeira: ${trash.length}</span>
    </div>
    <div style=${{ display:'grid', gridTemplateColumns:'2fr 1fr', gap:14, marginBottom:14 }}>
      <div class="card" style=${{ padding:16 }}>
        <div style=${{ fontWeight:800, fontSize:16, marginBottom:10 }}>Lixeira administrativa</div>
        <p style=${{ fontSize:12, color:'var(--s2)', margin:'0 0 12px' }}>Pedidos, orçamentos, recebimentos e RNCs excluídos ficam aqui para restauração ou exclusão definitiva.</p>
        <div style=${{ display:'flex', flexDirection:'column', gap:8, maxHeight:360, overflow:'auto' }}>
          ${trash.length===0 && html`<p style=${{ fontSize:13,color:'var(--s2)' }}>Nenhum item na lixeira.</p>`}
          ${trash.map(t=>html`<div key=${t.id} style=${{ border:'1px solid var(--bd)',borderRadius:12,padding:12,background:'#fff', display:'grid', gridTemplateColumns:'1fr auto', gap:10, alignItems:'center' }}>
            <div><div style=${{ fontWeight:800,fontSize:13 }}>${(t.type || '').toUpperCase()} · ${t.record?.numero || t.record?.semana || t.record?.id || 'registro'}</div><div style=${{ fontSize:12,color:'var(--s2)',marginTop:2 }}>${fDate(t.apagadoEm)} · ${t.motivo || 'Sem motivo informado'}</div></div>
            <div class="row"><button class="btn bs bsm" onClick=${()=>restaurar(t)}>Restaurar</button><button class="btn brd bsm" onClick=${()=>removerDef(t)}>Excluir definitivo</button></div>
          </div>`)}
        </div>
      </div>
      <div class="card" style=${{ padding:16 }}>
        <div style=${{ fontWeight:800, fontSize:16, marginBottom:10 }}>Painel de saúde operacional</div>
        <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
          ${[['Pedidos pendentes',pedidos.filter(p=>p.status==='pendente').length],['Recebimentos parciais',pedidos.filter(p=>p.status==='parcial').length],['Recebimentos OK',pedidos.filter(p=>p.status==='recebido').length],['RNCs abertas',rncs.filter(r=>r.status==='aberta'||r.status==='analise').length],['RNCs resolvidas',rncs.filter(r=>r.status==='resolvida').length],['Orçam. a autorizar',orcamentos.filter(o=>o.status!=='autorizado').length]].map(([l,v])=>html`<div style=${{ padding:12, border:'1px solid var(--bd)', borderRadius:12, background:'#fff' }}><div style=${{ fontSize:10,color:'var(--s3)',fontWeight:800,textTransform:'uppercase',letterSpacing:'.06em' }}>${l}</div><div style=${{ fontSize:24,fontWeight:800,fontFamily:"'Plus Jakarta Sans',sans-serif" }}>${v}</div></div>`)}
        </div>
      </div>
    </div>
    <${WeekControl} toast=${toast}/>
    <div class="card" style=${{ padding:16 }}>
      <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:12, marginBottom:10 }}><div style=${{ fontWeight:800, fontSize:16 }}>Logs e auditoria</div><input class="inp" style=${{ maxWidth:360 }} value=${logBusca} onInput=${e=>setLogBusca(e.target.value)} placeholder="Buscar por ação, data ou detalhe..."/></div>
      <div style=${{ display:'flex', flexDirection:'column', gap:8, maxHeight:380, overflow:'auto' }}>
        ${logsFiltrados.length===0 && html`<p style=${{ fontSize:13,color:'var(--s2)' }}>Nenhum log encontrado.</p>`}
        ${logsFiltrados.slice(0,120).map((l,i)=>html`<div key=${l.id||i} style=${{ border:'1px solid var(--bd)', borderRadius:12, padding:12, background:'#fff' }}><div style=${{ fontWeight:800, fontSize:13 }}>${fDate(l.data)} · ${l.acao || l.action || 'Ação'}</div><div style=${{ fontSize:12, color:'var(--s2)', marginTop:3 }}>${l.det || l.detail || 'Sem detalhe'}</div></div>`)}
      </div>
    </div>
  </div>`;
}


/* ══════════════════════════════════════
   GLOBAL SEARCH
══════════════════════════════════════ */
function GlobalSearch({ setTab }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState('');
  const ref = useRef(null);
  useEffect(() => { if (open) setTimeout(() => ref.current?.focus(), 80); }, [open]);
  useEffect(() => { const fn = e => { if (e.key === 'Escape') setOpen(false); }; window.addEventListener('keydown', fn); return () => window.removeEventListener('keydown', fn); }, []);
  const pedidos = LS.get('pedidos') || [];
  const rncs = LS.get('rncs') || [];
  const orcamentos = LS.get('orcamentos') || [];
  const resultados = q.trim().length < 2 ? [] : [
    ...pedidos.filter(p => wLbl(p.semana).toLowerCase().includes(q.toLowerCase()) || (p.origem||'').toLowerCase().includes(q.toLowerCase())).slice(0,3).map(p => ({ label: `Pedido · ${wLbl(p.semana)} · ${p.origem}`, tab: 'pedidos' })),
    ...rncs.filter(r => (r.numero||'').toLowerCase().includes(q.toLowerCase()) || (r.produto||'').toLowerCase().includes(q.toLowerCase())).slice(0,3).map(r => ({ label: `RNC · ${r.numero} · ${r.produto||''}`, tab: 'rnc' })),
    ...orcamentos.filter(o => wLbl(o.semana).toLowerCase().includes(q.toLowerCase()) || (o.origem||'').toLowerCase().includes(q.toLowerCase())).slice(0,3).map(o => ({ label: `Orçamento · ${wLbl(o.semana)} · ${o.origem}`, tab: 'orcamento' })),
  ];
  if (!open) return html`<button class="gsearch-fab btn" onClick=${() => setOpen(true)} title="Busca global"><${Ic} n="orders" s=${20}/><span class="gsearch-tip">Busca global</span></button>`;
  return html`<div class="mbg mcenter" onClick=${e => { if (e.target === e.currentTarget) setOpen(false); }}>
    <div class="mbox" style=${{ width: 'calc(100% - 32px)', maxWidth: 480 }}>
      <div class="row" style=${{ marginBottom: 12 }}>
        <input ref=${ref} class="inp" style=${{ flex: 1 }} value=${q} onInput=${e => setQ(e.target.value)} placeholder="Buscar pedido, RNC, orçamento..."/>
        <button class="btn bg0 bic" onClick=${() => setOpen(false)}><${Ic} n="x" s=${20}/></button>
      </div>
      ${resultados.length === 0 && q.trim().length >= 2 && html`<p style=${{ fontSize:13, color:'var(--s2)', textAlign:'center', padding:'12px 0' }}>Nenhum resultado encontrado.</p>`}
      ${resultados.map((r, i) => html`<button key=${i} class="card" style=${{ width:'100%', padding:'12px 16px', border:'none', textAlign:'left', cursor:'pointer', marginBottom:6, display:'block' }} onClick=${() => { setTab(r.tab); setOpen(false); setQ(''); }}><span style=${{ fontSize:13, fontWeight:600 }}>${r.label}</span></button>`)}
    </div>
  </div>`;
}

/* ══════════════════════════════════════
   TAB ERROR BOUNDARY
══════════════════════════════════════ */
class TabErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false, error: null }; }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  componentDidCatch(error, info) { console.error('TabErrorBoundary:', error, info); }
  componentDidUpdate(prev) { if (prev.tab !== this.props.tab) this.setState({ hasError: false, error: null }); }
  render() {
    if (this.state.hasError) {
      return React.createElement('div', { className: 'page' },
        React.createElement('div', { className: 'card', style: { padding: 24, textAlign: 'center' } },
          React.createElement('div', { style: { fontSize: 32, marginBottom: 8 } }, '⚠️'),
          React.createElement('div', { style: { fontWeight: 800, fontSize: 16, marginBottom: 8 } }, 'Erro nesta seção'),
          React.createElement('div', { style: { fontSize: 13, color: '#6B7280', marginBottom: 16 } }, String(this.state.error?.message || 'Erro desconhecido')),
          React.createElement('button', { className: 'btn bp', onClick: () => this.setState({ hasError: false, error: null }) }, 'Tentar novamente')
        )
      );
    }
    return this.props.children;
  }
}

/* ══════════════════════════════════════
   WEEK CONTROL
══════════════════════════════════════ */
function WeekControl({ toast }) {
  const cur = getWeekId();
  const sems = useMemo(genSems, []);
  const [sel, setSel] = useState(cur);
  const closed = LS.get('closedWeeks') || [];
  const isClosed = closed.includes(sel);
  return html`<div class="card" style=${{ padding: 16, marginBottom: 14 }}>
    <div style=${{ fontWeight: 800, fontSize: 16, marginBottom: 10 }}>Controle de semana</div>
    <div class="row" style=${{ gap: 8, marginBottom: 10 }}>
      <select class="inp" value=${sel} onChange=${e => setSel(e.target.value)} style=${{ flex: 1 }}>
        ${sems.map(s => html`<option key=${s} value=${s}>${wLbl(s)}${s === cur ? ' (atual)' : ''}</option>`)}
      </select>
      <span class=${`badge ${isClosed ? 'brd2' : 'bgr2'}`}>${isClosed ? 'Fechada' : 'Aberta'}</span>
    </div>
    <div class="row" style=${{ gap: 8 }}>
      <button class="btn bs bsm" style=${{ flex: 1 }} disabled=${!isClosed} onClick=${() => { reopenWeek(sel); toast.show(`${wLbl(sel)} reaberta`); }}><${Ic} n="ref" s=${14}/>Reabrir</button>
      <button class="btn bp bsm" style=${{ flex: 1 }} disabled=${isClosed} onClick=${() => { closeWeek(sel); toast.show(`${wLbl(sel)} fechada`); }}><${Ic} n="chk" s=${14}/>Fechar semana</button>
    </div>
  </div>`;
}

/* ══════════════════════════════════════
   APP ROOT
══════════════════════════════════════ */
function App() {
  const [tab, _setTab] = useState(LS.get('tabAtual') || 'inicio');
  const setTab = t => { LS.set('tabAtual', t); _setTab(t); };
  const toast = useToast();
  return html`<div style=${{ minHeight: '100dvh' }}>
    ${toast.ui}
    <${GlobalSearch} setTab=${setTab}/>
    <${Header} tab=${tab} setTab=${setTab}/>
    <main>
      <${TabErrorBoundary} tab=${tab}>
        ${tab === 'inicio' && html`<${InicioTab} setTab=${setTab}/>`}
        ${tab === 'orcamento' && html`<${OrcamentoTab} toast=${toast}/>`}
        ${tab === 'pedidos' && html`<${PedidosTab} toast=${toast}/>`}
        ${tab === 'recebimento' && html`<${RecebimentoTab} toast=${toast}/>`}
        ${tab === 'rnc' && html`<${RncTab} toast=${toast}/>`}
        ${tab === 'relatorios' && html`<${RelatoriosTab} toast=${toast}/>`}
        ${tab === 'analise' && html`<${AnaliseTab}/>`}
        ${tab === 'admin' && html`<${AdminLocal} toast=${toast}/>`}
        ${tab === 'config' && html`<${ConfigTab} toast=${toast}/>`}
      </${TabErrorBoundary}>
    </main>
    <${BottomNav} tab=${tab} setTab=${setTab}/>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
}
